{{define "head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.}}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 a { color: inherit; text-decoration: none; }
    textarea, pre { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 14px; }
    textarea { height: 22rem; padding: .75rem; }
    pre { background: #f5f5f5; padding: .75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .row { display: flex; gap: .5rem; align-items: center; margin: .75rem 0; }
    .row input[type=text] { flex: 1; padding: .4rem; }
    button { padding: .45rem 1rem; cursor: pointer; }
    .muted { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1><a href="/">pastebin</a></h1>
{{end}}

{{define "foot"}}
</body>
</html>
{{end}}
