name: pastebin

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BASE_URL: "http://localhost:8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: pastebin
      DB_PASSWORD: pastebin
      DB_NAME: pastebin
      # `RATE_LIMIT_CREATES_PER_MINUTE=0 make run` turns it off for load tests.
      RATE_LIMIT_CREATES_PER_MINUTE: ${RATE_LIMIT_CREATES_PER_MINUTE:-30}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1m}
      VIEWS_INTERVAL: ${VIEWS_INTERVAL:-1m}
      REDIS_ADDR: redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      # Not required: the app works without Redis, only slower.
      redis:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # The HTTP drain allows 10s, a cleanup batch 5s and the last write of read
    # counts 5s. The default of 10s would kill the app before they end.
    stop_grace_period: 25s

  mysql:
    image: mysql:8.4
    # Write only the changed columns to the binlog. With the default, FULL, every
    # update of a paste's read count would write its whole content there, twice.
    command: ["--binlog-row-image=MINIMAL"]
    environment:
      # Local development credentials only.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pastebin
      MYSQL_USER: pastebin
      MYSQL_PASSWORD: pastebin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP. The temporary server that creates the database
      # and user on first start does not listen on TCP, so this only passes once
      # MySQL is really ready.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # A cache, so nothing is kept across restarts: no snapshots, no append-only
  # file. Past 256 MB it evicts the least recently used keys.
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # No host mounts: /proc/stat, /proc/meminfo and /proc/loadavg are not
  # namespaced, so CPU, memory and load are the whole machine's. Network
  # metrics are this container's own and say nothing about the machine.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3000:3000"
    environment:
      # Local development only: anyone can view, admin/admin can sign in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/machine-resources.json
      # The dashboards only use built-in panels and the built-in Prometheus
      # source, so starting up needs nothing from grafana.com.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      # Only the folders we fill: mounting over all of provisioning/ hides the
      # image's empty plugins/ and alerting/ folders and Grafana logs errors.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql-data:
  prometheus-data:
