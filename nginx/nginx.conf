worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # The app logs every request, so a second log here would only cost CPU.
    access_log off;

    # Docker's DNS, asked again every 5s, so a replaced container's new address
    # is found without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream app {
        zone app 64k;
        # Every instance of the Compose service. After one failure an instance
        # is left alone for 5s.
        server app:8080 resolve max_fails=1 fail_timeout=5s;

        # Reuse connections to the app. They close before the app's own 60s idle
        # timeout, so nginx never sends a request on one the app is closing.
        keepalive 128;
        keepalive_timeout 30s;
    }

    server {
        listen 80;

        # The app used to enforce these itself, against the client. Now nginx is
        # what talks to the client.
        client_header_timeout 5s;
        client_body_timeout 10s;
        send_timeout 15s;
        keepalive_timeout 60s;

        # Over the app's body limit, so the app answers with its own 413. The
        # default of 1m would refuse a 512 KiB paste that URL-encodes to 1.5 MiB.
        client_max_body_size 2m;

        # Room for a 512 KiB paste, so reading one doesn't touch the disk.
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;

        location / {
            proxy_pass http://app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # Overwrites what the client sent, so it can't pick its own address.
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 1s;
            # Over the app's own 5s request deadline, so the app answers first.
            proxy_read_timeout 15s;

            # An instance that fails or stops answering: try the other one, once.
            # nginx doesn't repeat a POST this way, so no paste is created twice.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
