global:
  # Load tests run for 30s; the 1m default would give them one or two points.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pastebin
    static_configs:
      - targets: ["app:8080"]

  # The machine the containers run on. Under Docker Desktop that is its Linux
  # VM, not the Mac.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
