apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus # the dashboards refer to it by this uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches scrape_interval, so $__rate_interval never spans fewer than
      # four scrapes.
      timeInterval: 5s
